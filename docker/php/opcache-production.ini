; Production opcache settings, installed by the Dockerfile into the FPM SAPI only.
;
; The code in a built image never changes, so checking every cached script's mtime
; on each request is wasted stat() calls. Turning that off is the standard
; production setting. The base image deliberately leaves it ON, because a
; development container bind-mounts the source and must see every edit — which is
; why this lives in the production image and not in the base.
;
; A new release is a new container, so its opcache starts empty and nothing stale
; can be served. Do NOT edit files inside a running container and expect them to
; take effect: with this off, they will not.
;
; The runtime config and route caches docker/entrypoint.sh writes are unaffected:
; they are written before php-fpm starts, so the first request compiles them fresh.
opcache.validate_timestamps = 0
