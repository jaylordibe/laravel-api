name: Deploy To Production

on:
  # MANUAL ONLY. There is deliberately no `push:` trigger — merging to `main`
  # does NOT deploy. Someone has to open Actions → Deploy To Production → Run
  # workflow and pick `main`.
  #
  # Three consequences worth knowing before changing this:
  #
  #   1. The "Run workflow" button only appears when THIS FILE exists on the
  #      repository's default branch. On a branch it is invisible and production
  #      cannot be deployed from the UI at all.
  #
  #   2. `workflow_dispatch` offers a branch/tag dropdown that accepts ANY ref,
  #      not just `main`. The `push:` trigger used to be the only thing limiting
  #      which branch could reach production, so the `guard` job below now does
  #      that explicitly. Do not delete it.
  #
  #   3. Nothing runs on a push to `main` any more. That is not a CI gap:
  #      test.yml and security.yml both trigger on `pull_request` into `main`,
  #      so the commit was already tested before the merge — and dispatching
  #      this workflow re-runs both against the ref being deployed.
  #
  # To go back to deploying on every merge, restore the `push:` block above and
  # drop the `guard` job (the trigger then restricts the branch on its own).
  workflow_dispatch:

# Serialize production deploys so two clicks in quick succession don't race.
# `cancel-in-progress: false` — an in-flight production deploy must finish, not
# be killed mid-flight. A second run queues behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege: read-only access to the repository.
permissions:
  contents: read

jobs:
  # Restricts which ref may reach production. `workflow_dispatch` will happily
  # run this workflow from `develop`, a feature branch or a tag, and with no
  # `push:` trigger there is nothing else limiting that.
  #
  # A GitHub environment can enforce the same rule (Settings → Environments →
  # production → Deployment branches), which is the better place for it — but
  # that is a paid-plan feature on private repositories, so this job is what
  # makes the restriction hold on every plan. Keep both where both are available.
  #
  # It runs BEFORE test and security rather than as a step inside `deploy`, so a
  # dispatch from the wrong ref fails in seconds instead of after the full suite.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to deploy a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::refusing to deploy to production from '${REF}'. Production deploys run from refs/heads/main only — re-run this workflow with 'main' selected in the branch dropdown."
            exit 1
          fi
          echo "ref is refs/heads/main"

  test:
    name: Test
    needs: guard
    # Calls the reusable workflow rather than restating the test job. The three
    # workflows that gate on tests previously each carried their own copy, which
    # is how a check ends up enforced on a PR but not on the deploy that follows
    # it.
    uses: ./.github/workflows/test.yml

  # Dependency advisories and the Trivy filesystem scan. A separate workflow so
  # a slow or noisy scan never blocks the deterministic test signal — but called
  # here so it still gates the deploy. Without this job the audit runs on pull
  # requests and on the weekly cron only, and whatever is sitting on `main` at
  # dispatch time would ship with no dependency scanning at all.
  security:
    name: Security
    needs: guard
    uses: ./.github/workflows/security.yml

  deploy:
    name: Build And Deploy To Production
    # Deploy is OPT-IN, and it is the SECOND gate — the first is that somebody
    # has to dispatch this workflow at all. The template ships the
    # `DEPLOY_ENABLED` repository variable UNSET, so a dispatch on the template
    # itself (or any fresh fork) runs guard + CI and SKIPS the deploy — no
    # failed runs from an unconfigured target. In a real project, enable deploys
    # by EITHER deleting this `if:` line (+ this comment) OR setting repository
    # variable DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions →
    # Variables), once the target and its secrets are provisioned.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # GitHub environment — configure in Settings → Environments → production to:
    #   1. Require reviewer approval before the job runs (strongly recommended
    #      for production — it enforces a human check). Note that dispatching
    #      this workflow manually is a DELIBERATENESS gate, not a permission
    #      one: anyone with write access can press the button. Required
    #      reviewers is what turns it into a two-person operation, and it is a
    #      paid-plan feature on private repositories.
    #   2. Scope production secrets to this environment only. This is also what
    #      the `environment:` key below is for — a job without it reads
    #      repository secrets ONLY, and an environment secret silently resolves
    #      to an empty string.
    #   3. Restrict which branches may deploy to it (main). The `guard` job
    #      above enforces the same rule on plans where this setting is
    #      unavailable; where both exist, keep both.
    # The `url:` renders in the Actions UI as a link to the deployed environment.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── THIS TEMPLATE SHIPS NO CONFIGURED DEPLOYMENT TARGET ───────────────
      #
      # Replace this step with your real deployment. Whatever you choose, keep
      # the shape above: gated on `test`, opt-in via DEPLOY_ENABLED, serialized
      # by `concurrency`, scoped to a GitHub environment, and finished by a smoke
      # test that actually fails the run when the app does not come up.
      #
      # Migrations run BEFORE the new build starts serving, which means the OLD
      # build runs against the NEW schema for the length of the swap. The
      # `migration-safety` job in test.yml proves that window is survivable;
      # keep the ordering it assumes.
      - name: Deploy to production
        run: |
          echo 'No deployment target is configured for this template.'
          echo 'Replace this step with the real deploy, then set DEPLOY_ENABLED=true.'
          exit 1

      # Smoke test from the runner. Fails the deploy if the app does not come up
      # healthy within ~60s, so a broken build cannot sit silently in production.
      # PRODUCTION_URL is read through `env:` rather than interpolated: `${{ }}`
      # is substituted before bash parses the line, so a value containing shell
      # metacharacters would be executed rather than quoted.
      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo '::error::PRODUCTION_URL is not set, so the deploy cannot be verified. Set it in Settings → Environments → production.'
            exit 1
          fi
          last_code=""
          for attempt in $(seq 1 30); do
            # `|| code=000` must stay a separate assignment: curl writes its
            # `-w` output before exiting, so the inline `$(curl ... || echo X)`
            # form concatenates curl's own "000" with the fallback, matches
            # neither retry pattern, and reports an unreachable deploy healthy.
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "${PRODUCTION_URL}/api/app-versions/latest") || code=000
            case "$code" in
              000|5*) ;;
              *)
                echo "Healthy after ${attempt} attempt(s) (HTTP ${code})"
                exit 0
                ;;
            esac
            if [ "$code" != "$last_code" ]; then
              echo "attempt ${attempt}: HTTP ${code}"
              last_code=$code
            fi
            sleep 2
          done
          echo "::error::Health check failed after 60s — last status: HTTP ${last_code}"
          exit 1
