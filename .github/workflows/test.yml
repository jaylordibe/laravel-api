name: Test

# Reusable + PR-triggered. The deploy workflows call this via `uses:` to gate
# their deploys; PR events trigger it directly against the target branch.
#
# `workflow_call` is what lets one definition serve both. Without it each deploy
# workflow needs its own copy of the test job, and the copies drift — a check
# ends up enforced on a pull request but not on the deploy that follows it.
on:
  pull_request:
    branches:
      - main
      - staging
      - develop
  # Makes this workflow callable as
  # `jobs.<name>.uses: ./.github/workflows/test.yml`.
  workflow_call:

# Cancel in-flight runs for the same ref. Avoids two concurrent CI runs on
# rapid pushes; the newer commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: read access to the repository and nothing else.
permissions:
  contents: read

jobs:
  # Every job below is independent, with no `needs:` between them — the deploy
  # gate is bounded by the SLOWEST job, not by their sum. (Stated without a
  # count on purpose: a number here goes stale the moment a job is added.)

  # Style + the full suite, exactly as a developer runs them.
  #
  # `./test-pipeline.sh` is the single source of truth for HOW tests run: it
  # brings up the same docker-compose services a developer uses, waits for the
  # test database, installs dependencies, generates Passport keys and clients,
  # runs `php artisan app:format --check`, then `php artisan test --parallel`.
  # Reimplementing those steps here would create a second definition that drifts
  # from the one people actually run locally.
  tests:
    name: Format check and test suite
    runs-on: ubuntu-latest
    # ~2.5x a green run. A timeout is a runaway-job guard, NOT a capacity knob:
    # if it trips, something got stuck — find out what rather than raising it.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `app:format --check`, never the fixing form. `app:format` exits 0 after
      # rewriting whatever it repaired, so a fixing formatter in CI silently
      # patches the runner's copy, passes, and throws the fixes away with the
      # container — enforcing the style nowhere. test-pipeline.sh uses --check
      # for exactly this reason; do not "helpfully" change it.
      - name: Run the pipeline (format check + parallel test suite)
        run: ./test-pipeline.sh

      # Container logs are the first thing you want when the failure is "PostgreSQL
      # never came up" rather than "an assertion failed", and they are gone the
      # moment the runner is torn down.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Migrations meeting data that already exists — the one failure class every
  # other gate in this file is structurally blind to.
  #
  # `./test.sh` runs `migrate:fresh --seed`, so the suite only ever proves
  # migrations apply to an EMPTY schema. A real deployment applies them to a
  # populated one, and applies them BEFORE the new build starts serving, so the
  # OLD code runs against the NEW schema for the length of the swap. A dropped
  # column, a tightened NOT NULL, a rename, or a unique index that collides with
  # existing duplicates passes the formatter, the test suite and the security
  # scan, then fails in production with the schema already changed.
  #
  # Runs in parallel with the other jobs so it never lengthens the deploy gate,
  # and skips itself entirely when a change touches no migration — which is most
  # changes.
  migration-safety:
    name: Migrations against existing data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v4
        with:
          path: head

      # `main` is what production is actually running. Diffing against the PR's
      # base branch instead would miss anything already merged to develop but
      # not yet released — and it is the released schema these migrations will
      # really land on.
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Decide whether this change touches migrations
        id: scope
        run: |
          set -euo pipefail
          if diff -rq base/database/migrations head/database/migrations >/dev/null 2>&1; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No migration changes against the released commit — nothing for this job to prove.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'Migration changes against the released commit:'
          diff -rq base/database/migrations head/database/migrations || true

          # A migration file that exists on `main` and has been EDITED or DELETED
          # here is a rewrite of history that has already run somewhere. Laravel
          # records applied migrations by filename in the `migrations` table, so
          # an edited file silently changes a fresh database while leaving every
          # migrated environment on the old schema. Nothing downstream can detect
          # that, which is why it fails here instead.
          rewritten=false
          for released in base/database/migrations/*.php; do
            [ -e "$released" ] || continue
            name="$(basename "$released")"
            proposed="head/database/migrations/$name"
            if [ ! -f "$proposed" ]; then
              echo "::error::released migration '$name' has been DELETED"
              rewritten=true
            elif ! diff -q "$released" "$proposed" >/dev/null 2>&1; then
              echo "::error::released migration '$name' has been EDITED"
              rewritten=true
            fi
          done
          if [ "$rewritten" = 'true' ]; then
            echo '::error::A migration that has already run was edited or deleted. Laravel keys applied migrations by filename, so this changes a fresh database while every migrated environment keeps the old schema. Add a NEW migration instead.'
            exit 1
          fi

      # Only the test database service — this job never touches the dev volume.
      # The same docker-compose.yml developers use, so the image, credentials
      # and port have exactly one definition.
      - name: Start PostgreSQL
        if: steps.scope.outputs.changed == 'true'
        working-directory: head
        run: |
          set -euo pipefail
          cp .env.example .env
          set -a; . ./.env; set +a
          docker compose up -d app-db-test
          for attempt in $(seq 1 60); do
            if docker exec "${SERVICE_NAME}-db-test" \
              pg_isready -U "$TEST_DB_USERNAME" -d "$TEST_DB_DATABASE" >/dev/null 2>&1; then
              echo "PostgreSQL is up (attempt ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo '::error::PostgreSQL never became reachable'
          exit 1

      - name: Set up PHP
        if: steps.scope.outputs.changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, curl, pdo, pdo_pgsql, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install dependencies (released commit)
        if: steps.scope.outputs.changed == 'true'
        working-directory: base
        run: composer install --prefer-dist --no-progress --no-interaction

      # Recreates production's starting point: the released schema, carrying
      # rows. Artisan runs on the RUNNER, so the container-network hostname in
      # .env cannot be used — DB_HOST/DB_PORT are exported to the published
      # port instead. Dotenv is immutable by default, so an exported value wins
      # over the file without editing it; every other credential still comes
      # from .env.example and is never retyped here.
      - name: Apply released migrations and seed data
        if: steps.scope.outputs.changed == 'true'
        working-directory: base
        run: |
          set -euo pipefail
          cp .env.example .env
          set -a; . ./.env; set +a
          export DB_HOST=127.0.0.1
          export DB_PORT=5435
          export DB_SSLMODE=disable
          export DB_DATABASE="$TEST_DB_DATABASE"
          export DB_USERNAME="$TEST_DB_USERNAME"
          export DB_PASSWORD="$TEST_DB_PASSWORD"
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force

      # Without this the job could pass against an empty database and prove
      # nothing at all — the exact vacuous-green failure it exists to prevent.
      - name: Assert the database is actually populated
        if: steps.scope.outputs.changed == 'true'
        working-directory: head
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          row_count=$(docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" "${SERVICE_NAME}-db-test" \
            psql -U "$TEST_DB_USERNAME" -d "$TEST_DB_DATABASE" \
            -tA -c 'SELECT COUNT(*) FROM users;' 2>/dev/null | tr -d '[:space:]')
          echo "users table holds ${row_count} row(s)"
          if [ "${row_count:-0}" -lt 1 ]; then
            echo '::error::seeding produced no rows, so applying migrations to a populated database was never actually tested'
            exit 1
          fi

      - name: Install dependencies (proposed commit)
        if: steps.scope.outputs.changed == 'true'
        working-directory: head
        run: composer install --prefer-dist --no-progress --no-interaction

      # The primary assertion: the NEW migrations applied on top of the released
      # schema, with real rows underneath them.
      - name: Apply the proposed migrations to the populated database
        if: steps.scope.outputs.changed == 'true'
        working-directory: head
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          export DB_HOST=127.0.0.1
          export DB_PORT=5435
          export DB_SSLMODE=disable
          export DB_DATABASE="$TEST_DB_DATABASE"
          export DB_USERNAME="$TEST_DB_USERNAME"
          export DB_PASSWORD="$TEST_DB_PASSWORD"
          php artisan key:generate
          if ! php artisan migrate --force; then
            echo '::error::the proposed migrations do not apply to a database that already holds data — this would fail mid-deploy, after the schema has already changed'
            exit 1
          fi

      # The expand/contract assertion. A deployment runs the OLD build against
      # the NEW schema for the whole swap window, so a migration that removes or
      # tightens something the released code still reads takes the API down
      # before the new build ever starts.
      #
      # `app-versions/latest` is the probe because it is the one PUBLIC route
      # that exercises the whole stack — route, controller, service, repository,
      # model, resource — against the database, with no token to mint first.
      - name: Prove the released build still serves traffic on the new schema
        if: steps.scope.outputs.changed == 'true'
        working-directory: base
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          export DB_HOST=127.0.0.1
          export DB_PORT=5435
          export DB_SSLMODE=disable
          export DB_DATABASE="$TEST_DB_DATABASE"
          export DB_USERNAME="$TEST_DB_USERNAME"
          export DB_PASSWORD="$TEST_DB_PASSWORD"

          php artisan serve --host=127.0.0.1 --port=8010 > served.log 2>&1 &
          application_pid=$!
          trap 'kill "$application_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            # `|| status=000` is a separate assignment on purpose: curl emits
            # its `-w` output before exiting, so the inline `$(curl ... || echo
            # 000)` form yields "000000" on a connection failure and falls
            # through to the success branch below.
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8010/api/app-versions/latest) || status=000
            # Any answered HTTP status proves the released code booted and
            # queried the migrated schema. A 5xx does not: that is precisely the
            # incompatibility this step exists to catch.
            case "$status" in
              000|5*) ;;
              *)
                echo "released build answered HTTP ${status} on the migrated schema (attempt ${attempt})"
                exit 0
                ;;
            esac
            if ! kill -0 "$application_pid" 2>/dev/null; then
              echo '::error::the released build exited against the new schema — this migration is not backwards-compatible and will break the deploy window'
              cat served.log
              exit 1
            fi
            sleep 2
          done

          echo '::error::the released build never served a non-5xx response on the new schema within 60s — treat this migration as not backwards-compatible'
          cat served.log
          exit 1

      - name: Dump container logs on failure
        if: failure() && steps.scope.outputs.changed == 'true'
        working-directory: head
        run: docker compose logs --no-color --tail=200

  # The artifact that actually ships. Nothing else in CI touches it: the suite
  # and migration-safety both run artisan ON THE RUNNER against docker-compose
  # services, so a Dockerfile that cannot build reaches production unchallenged.
  #
  # The failure modes are specific, not theoretical. `php artisan config:cache`
  # serializes config with var_export(), so ONE non-serializable value in a
  # config file — an object with no __set_state(), such as Scramble's
  # SecurityScheme — fails the image build while every other gate stays green,
  # because nothing else caches config. Separately, .dockerignore excludes the
  # runtime-writable storage directories, so the Dockerfile must recreate them
  # or `view:cache` aborts at build time and php-fpm cannot write logs at run
  # time. This job is the only thing standing in front of either.
  #
  # Deliberately NOT `needs: tests`. Gating would append this job's runtime to
  # every deploy; running it alongside costs a wasted image build on runs where
  # the suite fails, and saves those minutes on every green deploy.
  docker:
    name: Build and scan the production image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: laravel-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVEs in the base image's OS packages and in the installed vendor tree —
      # the half `composer audit` in security.yml cannot see, because it reads
      # composer.lock and never looks at the image the application runs inside.
      # Fails on HIGH/CRITICAL; `ignore-unfixed` skips CVEs with no published
      # patch so the build doesn't red-light on findings nobody can act on.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: laravel-api:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Trivy reads the image's filesystem; it never executes anything, so an
      # image that cannot boot passes it cleanly. These checks run the real
      # binary against the real cached artifacts.
      #
      # What this does NOT prove: serving traffic. There is no database, Redis
      # or APP_KEY here, so anything past bootstrap is out of scope — claiming
      # otherwise would let a second failure hide behind the first.
      - name: Verify the built image boots what it will serve
        run: |
          set -euo pipefail

          echo '::group::runtime directories and the ABSENCE of a baked config cache'
          docker run --rm --entrypoint sh laravel-api:ci -c '
            set -eu
            test -f vendor/autoload.php

            # THE CONFIG CACHE MUST NOT EXIST IN THE IMAGE.
            #
            # `config:cache` freezes the value of every env() call. Run at build
            # time — where .dockerignore has excluded .env, so only defaults
            # exist — it would bake DB_HOST=127.0.0.1 into the image and make
            # Laravel ignore every value the platform injects later, silently.
            # docker/entrypoint.sh builds the cache at CONTAINER START instead.
            if [ -f bootstrap/cache/config.php ]; then
              echo "bootstrap/cache/config.php was baked into the image; runtime env would be ignored" >&2
              exit 1
            fi
            if ls bootstrap/cache/routes-*.php >/dev/null 2>&1; then
              echo "a route cache was baked into the image" >&2
              exit 1
            fi

            # .dockerignore drops these from the build context; the Dockerfile
            # recreates them. Without them view:cache fails at build time and
            # php-fpm cannot write logs at runtime.
            test -d storage/framework/views
            test -d storage/logs
            # The Blade cache IS built at build time — it depends only on files
            # in the build context, never on the environment.
            ls storage/framework/views/*.php >/dev/null
            # php-fpm and nginx serve as www-data, so the application must own
            # everything it writes.
            owner=$(stat -c %U storage/logs)
            if [ "$owner" != www-data ]; then
              echo "storage/logs is owned by $owner, not www-data" >&2
              exit 1
            fi
            echo "no baked config/route cache; compiled views present; storage writable by www-data"
          '
          echo '::endgroup::'

          echo '::group::framework boots'
          docker run --rm --entrypoint php laravel-api:ci artisan --version
          echo '::endgroup::'

          # THE RUNTIME-ENVIRONMENT PROOF.
          #
          # This is the check that would have caught a build-time config:cache.
          # It injects values at `docker run` time — exactly how a platform
          # supplies them — then asks the application what it actually resolved.
          # Because entrypoint.sh caches config at container start, the answer
          # must be the injected values and not the defaults compiled from
          # config/*.php.
          #
          # A non-serializable config value still fails here, just at container
          # start instead of image build, so the coverage the old build-time
          # cache provided is not lost.
          echo '::group::runtime environment is honoured by the built image'
          resolved=$(docker run --rm \
            -e APP_RUNTIME_MODE=artisan \
            -e APP_CONFIG_CHECK=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e APP_ENV=production \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=db.runtime.example \
            -e DB_PORT=6543 \
            -e DB_DATABASE=runtime_db \
            -e REDIS_HOST=redis.runtime.example \
            -e FILESYSTEM_DISK=s3 \
            -e AWS_BUCKET=runtime-bucket \
            laravel-api:ci \
            config:show database.connections.pgsql --no-ansi 2>&1)
          printf '%s\n' "$resolved"

          for expected in db.runtime.example 6543 runtime_db; do
            if ! grep -q "$expected" <<<"$resolved"; then
              echo "::error::the image did not honour a runtime-injected value (${expected} missing). A configuration cache baked at BUILD time makes Laravel ignore the environment."
              exit 1
            fi
          done

          # Negative control. Without it, a command that printed nothing useful
          # would pass every grep above by accident.
          if grep -q '127\.0\.0\.1' <<<"$resolved"; then
            echo '::error::the resolved database host is still the default 127.0.0.1 — runtime environment was ignored'
            exit 1
          fi

          # ANTI-VACUOUS CONTROL. The greps above pass whether or not the cache
          # was actually built: entrypoint.sh deliberately falls back to live
          # config when `config:cache` fails, and live config resolves the SAME
          # injected values. So a broken cache — the non-serializable-config-value
          # failure this job exists to catch — would sail through.
          #
          # Assert the cache artefact really exists and no fallback warning was
          # emitted, which is what makes the check above mean what it claims.
          cache_state=$(docker run --rm \
            -e APP_RUNTIME_MODE=artisan -e APP_CONFIG_CHECK=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --entrypoint sh laravel-api:ci -c '
              /usr/local/bin/app-entrypoint.sh --version >/tmp/out 2>&1 || true
              cat /tmp/out
              test -f bootstrap/cache/config.php && echo "CONFIG_CACHE_PRESENT"
              ls bootstrap/cache/routes-*.php >/dev/null 2>&1 && echo "ROUTE_CACHE_PRESENT"
            ')
          printf '%s\n' "$cache_state"

          if ! grep -q 'CONFIG_CACHE_PRESENT' <<<"$cache_state"; then
            echo '::error::the entrypoint did not produce bootstrap/cache/config.php — the runtime-env assertion above passed only because the uncached fallback resolves the same values'
            exit 1
          fi
          if grep -qi 'config:cache failed\|route:cache failed' <<<"$cache_state"; then
            echo '::error::the entrypoint fell back to live configuration; a config value is probably not var_export-serializable'
            exit 1
          fi
          echo '::endgroup::'

      # THE RUNTIME SPLIT.
      #
      # The base image starts nginx, php-fpm AND `php artisan horizon` from one
      # supervisord config. If that leaks into the api runtime, every API replica
      # carries a Horizon master, queue concurrency becomes a function of web
      # traffic, and a deploy's `horizon:terminate` races across replicas. None of
      # that shows up in a test suite, an image build or a Trivy scan, so it is
      # asserted here.
      #
      # APP_ENTRYPOINT_DRY_RUN makes the entrypoint do all its preparation and
      # then return instead of handing over to a long-running process, so the
      # resulting container state can be inspected without booting supervisord.
      - name: Verify each runtime mode configures the right processes
        run: |
          set -euo pipefail

          # Shared: no config cache (nothing to connect to here) and no
          # fail-fast config check (no database, Redis or keys in this job).
          common_env=(
            --rm --entrypoint sh
            -e APP_ENTRYPOINT_DRY_RUN=true
            -e APP_RUNTIME_CONFIG_CACHE=false
            -e APP_CONFIG_CHECK=false
          )

          echo '::group::api mode: Horizon disabled, listening on :80'
          api_state=$(docker run "${common_env[@]}" -e APP_RUNTIME_MODE=api laravel-api:ci -c '
            /usr/local/bin/app-entrypoint.sh >/dev/null 2>&1
            echo "--- horizon autostart ---"
            awk "/^\[/ { inside = (\$0 == \"[program:horizon]\") } inside && /^autostart/ { print; exit }" \
              /etc/supervisor/conf.d/supervisord.conf
            echo "--- listen directives ---"
            grep -E "^[[:space:]]*listen" /etc/nginx/conf.d/default.conf
          ')
          printf '%s\n' "$api_state"

          if ! grep -q 'autostart=false' <<<"$api_state"; then
            echo '::error::api mode did NOT disable the Horizon supervisor program — every API replica would run a queue worker'
            exit 1
          fi
          if ! grep -qE 'listen 80;' <<<"$api_state"; then
            echo '::error::api mode is not listening on the documented default port 80'
            exit 1
          fi
          echo '::endgroup::'

          # PORT is honoured, and the php-fpm ping listener moves out of the way
          # rather than colliding when PORT is the one it normally uses.
          echo '::group::api mode: PORT=8080 is honoured and the ping listener relocates'
          port_state=$(docker run "${common_env[@]}" -e APP_RUNTIME_MODE=api -e PORT=8080 laravel-api:ci -c '
            /usr/local/bin/app-entrypoint.sh >/dev/null 2>&1
            grep -E "^[[:space:]]*listen" /etc/nginx/conf.d/default.conf
            cat /run/app-runtime.env
          ')
          printf '%s\n' "$port_state"

          if ! grep -qE 'listen 8080;' <<<"$port_state"; then
            echo '::error::PORT=8080 was not applied to the nginx listener'
            exit 1
          fi
          if grep -qE 'listen 127\.0\.0\.1:8080;' <<<"$port_state"; then
            echo '::error::the php-fpm ping listener still binds 8080 and collides with the application port'
            exit 1
          fi
          echo '::endgroup::'

          # `all` is the single-container escape hatch and must NOT disable Horizon.
          echo '::group::all mode: Horizon left enabled'
          all_state=$(docker run "${common_env[@]}" -e APP_RUNTIME_MODE=all laravel-api:ci -c '
            /usr/local/bin/app-entrypoint.sh >/dev/null 2>&1
            awk "/^\[/ { inside = (\$0 == \"[program:horizon]\") } inside && /^autostart/ { print; exit }" \
              /etc/supervisor/conf.d/supervisord.conf
          ')
          printf '%s\n' "$all_state"

          if grep -q 'autostart=false' <<<"$all_state"; then
            echo '::error::all mode disabled Horizon, but it is the one mode that must run it alongside the API'
            exit 1
          fi
          echo '::endgroup::'

          # Each remaining mode reports the command it would run. This catches a
          # mode being renamed, dropped, or wired to the wrong command.
          echo '::group::worker / scheduler / migrate resolve to the documented commands'
          for pair in 'worker|artisan horizon' 'scheduler|artisan schedule:run' 'migrate|artisan migrate --force'; do
            mode=${pair%%|*}
            expected=${pair#*|}
            output=$(docker run "${common_env[@]}" -e APP_RUNTIME_MODE="$mode" laravel-api:ci \
              -c '/usr/local/bin/app-entrypoint.sh 2>&1')
            printf '%s -> %s\n' "$mode" "$output"
            # Asserts the COMMAND only. The dry-run line is printed by the script
            # itself, so it proves nothing about the actual uid — that is asserted
            # separately below, by running for real.
            if ! grep -qF "would exec as www-data: php ${expected}" <<<"$output"; then
              echo "::error::mode '${mode}' did not resolve to 'php ${expected}'"
              exit 1
            fi
          done
          echo '::endgroup::'

          # REAL privilege-drop proof. The dry-run assertions above match a
          # literal the script prints; they would still pass if setpriv were
          # deleted. This runs a one-shot mode FOR REAL and reads the numeric
          # owner of a file that process wrote.
          #
          # `stat -c %u` inside a committed snapshot, NOT `docker cp | tar -tv`:
          # tar renders the owner as "33/33" under GNU tar and "33     33" under
          # BSD tar, so any grep over that output passes on one machine and
          # fails on another. stat prints the uid and nothing else.
          echo '::group::one-shot runtimes really do drop to www-data'
          probe_container=$(docker create \
            -e APP_RUNTIME_MODE=artisan \
            -e APP_RUNTIME_CONFIG_CACHE=false \
            -e APP_CONFIG_CHECK=false \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            laravel-api:ci config:cache)
          docker start -a "$probe_container"
          docker commit "$probe_container" laravel-api:privilege-probe >/dev/null
          docker rm -f "$probe_container" >/dev/null

          owner_uid=$(docker run --rm --entrypoint stat laravel-api:privilege-probe \
            -c '%u' /var/www/html/bootstrap/cache/config.php)
          docker image rm -f laravel-api:privilege-probe >/dev/null 2>&1 || true
          echo "config.php was written by uid ${owner_uid}"

          # 33 is www-data in the Debian/Ubuntu base image; root would be 0.
          if [ "$owner_uid" != '33' ]; then
            echo "::error::the artisan runtime wrote as uid ${owner_uid}, not 33 (www-data) — the privilege drop did not happen"
            exit 1
          fi
          echo '::endgroup::'

          echo '::group::an unknown mode fails loudly instead of guessing'
          if docker run "${common_env[@]}" -e APP_RUNTIME_MODE=nonsense laravel-api:ci \
              -c '/usr/local/bin/app-entrypoint.sh' 2>/dev/null; then
            echo '::error::an unknown APP_RUNTIME_MODE was accepted'
            exit 1
          fi
          echo 'unknown mode rejected'
          echo '::endgroup::'

          # Positive control: grep on empty output fails, so an image that
          # produced nothing cannot pass this by omission.
          echo '::group::routes resolve from the cached route table'
          route_output=$(docker run --rm --entrypoint php laravel-api:ci \
            artisan route:list --path=api/app-versions --no-ansi)
          printf '%s\n' "$route_output"
          if ! grep -q 'api/app-versions' <<<"$route_output"; then
            echo '::error::the image cannot resolve its cached routes'
            exit 1
          fi
          echo '::endgroup::'
